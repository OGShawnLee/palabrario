services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-palabrario}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./SCHEMA_FINAL.sql:/docker-entrypoint-initdb.d/init.sql:ro

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: palabrario_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./SCHEMA_FINAL.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d palabrario_test"]
      interval: 1s
      timeout: 2s
      retries: 20

  core-service:
    build:
      # IMPORTANTE (Monorrepositorio en Go):
      # El 'context' apunta a la raíz ('.') y NO a './core-service' porque Docker prohíbe
      # hacer 'COPY ../' fuera del contexto de construcción. Al situar el contexto en la raíz,
      # el Dockerfile puede acceder tanto al código del servicio ('./core-service') como al
      # paquete compartido de modelos de dominio ('./pkg') y al manifiesto raíz 'go.mod'.
      context: .
      dockerfile: ./core-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    env_file:
      - ./core-service/.env

  realtime-service:
    build:
      context: .
      dockerfile: ./realtime-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./realtime-service/.env

  image-service:
    build:
      context: .
      dockerfile: ./image-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ./image-service/.env

volumes:
  postgres_data:
