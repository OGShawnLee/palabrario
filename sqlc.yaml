version: "2"
sql:
  - schema: "SCHEMA_FINAL.sql"
    queries: "sql/queries/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "core-service/internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
